schema: spec-driven

context: |
  API de gestion de productos en Go + GraphQL (gqlgen) con Clean Architecture.
  Capas: dominio (invariantes de negocio), usecase (aplicacion), repository (memoria; postgres
  pendiente) y delivery (GraphQL). Convenciones: TDD estricto (red-green-refactor), conventional
  commits, archivos <= 300 lineas, funciones <= 40, errores de dominio tipados envueltos con %w.
  Comandos: go test ./... -race, go build ./..., go vet ./..., make generate.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
